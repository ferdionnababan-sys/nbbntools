name: Browser Evidence (Playwright)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to test (must be a public site or preview)"
        required: true
        default: "https://nbbntools.my.id/"
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/browser-evidence.yml"
      - "tests/browser/**"

permissions:
  contents: read

jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ inputs.target_url || 'https://nbbntools.my.id/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run real-browser checks
        run: node tests/browser/evidence.mjs
      - name: Upload screenshots and report (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbbntools-browser-evidence
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 14
