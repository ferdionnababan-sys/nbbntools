<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Case Converter gratis untuk uppercase, lowercase, title case, dan sentence case."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/case/"><link rel="stylesheet" href="/assets/style.css"><title>Case Converter — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Case Converter</h1><p>Ubah format huruf teks dengan cepat.</p><textarea id="t" placeholder="Masukkan teks..."></textarea><div class="actions"><button class="primary" onclick="go('u')">UPPERCASE</button><button class="secondary" onclick="go('l')">lowercase</button><button class="secondary" onclick="go('t')">Title Case</button><button class="secondary" onclick="go('s')">Sentence case</button><button class="secondary" onclick="navigator.clipboard.writeText(t.value)">Salin</button></div></section></main><script>function go(m){let x=t.value;if(m==='u')t.value=x.toUpperCase();if(m==='l')t.value=x.toLowerCase();if(m==='t')t.value=x.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());if(m==='s')t.value=x.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g,(a,b,c)=>b+c.toUpperCase())}</script></body></html>
