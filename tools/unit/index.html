<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Konverter satuan gratis untuk panjang, berat, suhu, dan volume."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/unit/"><link rel="stylesheet" href="/assets/style.css"><title>Konverter Satuan — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Konverter Satuan</h1><p>Konversi satuan umum langsung di browser.</p><div class="row"><div><label for="type">Jenis</label><select id="type" onchange="resetUnits()"><option value="l">Panjang</option><option value="w">Berat</option><option value="v">Volume</option><option value="t">Suhu</option></select></div><div><label for="n">Nilai</label><input id="n" type="number" value="1" step="any"></div></div><div class="row"><div><label for="a">Dari</label><select id="a"></select></div><div><label for="b">Ke</label><select id="b"></select></div></div><div class="actions"><button class="primary" onclick="go()">Konversi</button><button class="secondary" onclick="copyResult()">Salin</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div></section></main><script>const sets={l:{meter:1,kilometer:1000,centimeter:.01,millimeter:.001,mile:1609.344,foot:.3048},w:{gram:1,kilogram:1000,milligram:.001,pound:453.59237,ounce:28.3495},v:{liter:1,milliliter:.001,cubic_meter:1000,gallon:3.785411784}};function resetUnits(){const x=document.getElementById('type').value,a=document.getElementById('a'),b=document.getElementById('b');if(x==='t')a.innerHTML=b.innerHTML='<option>Celsius</option><option>Fahrenheit</option><option>Kelvin</option>';else{const q=Object.keys(sets[x]);a.innerHTML=b.innerHTML=q.map(z=>`<option value="${z}">${z}</option>`).join('')}}function go(){const x=document.getElementById('type').value,v=Number(document.getElementById('n').value)||0,a=document.getElementById('a').value,b=document.getElementById('b').value;let z;if(x==='t'){const c=a==='Celsius'?v:a==='Fahrenheit'?(v-32)*5/9:v-273.15;z=b==='Celsius'?c:b==='Fahrenheit'?c*9/5+32:c+273.15}else z=v*sets[x][a]/sets[x][b];document.getElementById('r').textContent=`${v} ${a} = ${Number(z.toFixed(8))} ${b}`}async function copyResult(){const text=document.getElementById('r').textContent;if(text==='Hasil akan muncul di sini.')return;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}resetUnits()</script></body></html>
