<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator cicilan pinjaman gratis dengan estimasi pembayaran bulanan."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/emi/"><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><meta property="og:title" content="Kalkulator Cicilan — NBBNTOOLS"><meta property="og:description" content="Kalkulator cicilan pinjaman gratis dengan estimasi pembayaran bulanan."><meta property="og:url" content="https://nbbntools.my.id/tools/emi/"><meta property="og:type" content="website"><meta property="og:site_name" content="NBBNTOOLS"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Kalkulator Cicilan — NBBNTOOLS"><meta name="twitter:description" content="Kalkulator cicilan pinjaman gratis dengan estimasi pembayaran bulanan."><link rel="stylesheet" href="/assets/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Cicilan — NBBNTOOLS","url":"https://nbbntools.my.id/tools/emi/","applicationCategory":"FinanceApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Cicilan — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Cicilan</h1><p>Estimasi cicilan bulanan berdasarkan pokok, bunga tahunan, dan tenor. Nominal otomatis menggunakan format ribuan Indonesia.</p><div class="row"><div><label for="p">Pinjaman (Rp)</label><input id="p" class="money" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div><div><label for="b">Bunga/tahun (%)</label><input id="b" type="number" min="0" step=".01" inputmode="decimal" placeholder="0"></div></div><label for="n">Tenor (bulan)</label><input id="n" type="number" min="1" step="1" inputmode="numeric" placeholder="12"><div class="actions"><button class="primary" id="calc" type="button">Hitung</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div><p class="note">Simulasi matematika, bukan penawaran kredit.</p></section></main><script>const p=document.getElementById('p'),b=document.getElementById('b'),n=document.getElementById('n'),r=document.getElementById('r'),copy=document.getElementById('copy');const f=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v);const raw=el=>Number(String(el.value).replace(/\D/g,''))||0;p.addEventListener('input',()=>{const v=raw(p);p.value=v?new Intl.NumberFormat('id-ID').format(v):''});document.getElementById('calc').addEventListener('click',()=>{const principal=raw(p),annual=Number(b.value),months=Number(n.value);if(!Number.isSafeInteger(principal)||principal<=0||!Number.isFinite(annual)||annual<0||!Number.isInteger(months)||months<1){r.textContent='Masukkan pinjaman yang valid, bunga 0% atau lebih, dan tenor minimal 1 bulan.';return}const rate=annual/1200,monthly=rate?(principal*rate*Math.pow(1+rate,months))/(Math.pow(1+rate,months)-1):principal/months,total=monthly*months;if(!Number.isFinite(monthly)||!Number.isFinite(total)){r.textContent='Nilai terlalu besar untuk dihitung dengan aman.';return}r.textContent=`Cicilan/bulan: ${f(monthly)}\nTotal pembayaran: ${f(total)}\nTotal bunga: ${f(Math.max(0,total-principal))}`});copy.addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){copy.textContent='Gagal menyalin';setTimeout(()=>copy.textContent='Salin',1800)}});document.getElementById('reset').addEventListener('click',()=>{p.value='';b.value='';n.value='';r.textContent='Hasil akan muncul di sini.';copy.textContent='Salin';p.focus()});</script></body></html>
