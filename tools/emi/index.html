<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator cicilan pinjaman gratis dengan estimasi pembayaran bulanan."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/emi/"><link rel="stylesheet" href="/assets/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Cicilan — NBBNTOOLS","url":"https://nbbntools.my.id/tools/emi/","applicationCategory":"FinanceApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Cicilan — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Cicilan</h1><p>Estimasi cicilan bulanan berdasarkan pokok, bunga tahunan, dan tenor.</p><div class="row"><div><label for="p">Pinjaman (Rp)</label><input id="p" type="number" min="0" step="any"></div><div><label for="b">Bunga/tahun (%)</label><input id="b" type="number" min="0" step=".01"></div></div><label for="n">Tenor (bulan)</label><input id="n" type="number" min="1" step="1"><div class="actions"><button class="primary" onclick="go()">Hitung</button><button class="secondary" onclick="copyResult()">Salin</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div><p class="note">Simulasi matematika, bukan penawaran kredit.</p></section></main><script>const f=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);function go(){const p=Math.max(0,Number(document.getElementById('p').value)||0),x=Math.max(0,Number(document.getElementById('b').value)||0)/1200,n=Math.max(1,Math.floor(Number(document.getElementById('n').value)||1)),q=x?(p*x*Math.pow(1+x,n))/(Math.pow(1+x,n)-1):p/n;document.getElementById('r').textContent=`Cicilan/bulan: ${f(q)}\nTotal: ${f(q*n)}\nTotal bunga: ${f(Math.max(0,q*n-p))}`}async function copyResult(){const text=document.getElementById('r').textContent;if(text==='Hasil akan muncul di sini.')return;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}</script></body></html>
