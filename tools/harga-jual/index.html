<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator harga jual gratis NBBNTOOLS. Hitung harga jual berdasarkan modal, biaya tambahan, dan target keuntungan."><link rel="canonical" href="https://nbbntools.my.id/tools/harga-jual/"><title>Kalkulator Harga Jual Gratis — NBBNTOOLS</title><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#172033}.nav{padding:18px 6%;background:#fff;border-bottom:1px solid #e7eaf1}.brand{font-weight:800;font-size:22px}.brand span{color:#5b5cf0}.wrap{max-width:760px;margin:50px auto;padding:0 20px}.box{background:#fff;border:1px solid #e7eaf1;border-radius:22px;padding:28px;box-shadow:0 10px 30px #1720330d}h1{font-size:clamp(32px,6vw,48px);margin:0 0 10px}p{color:#667085;line-height:1.7}label{display:block;font-weight:700;font-size:13px;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #dfe3eb;border-radius:10px;box-sizing:border-box}button{margin-top:18px;padding:13px 17px;border:0;border-radius:11px;background:#5b5cf0;color:white;font-weight:800}.result{margin-top:18px;padding:17px;background:#f1f2ff;border-radius:12px;white-space:pre-line;line-height:1.7}.back{display:inline-block;margin-top:20px;color:#5b5cf0}</style></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a></nav><main class="wrap"><div class="box"><h1>Kalkulator Harga Jual</h1><p>Hitung harga jual produk berdasarkan modal, biaya tambahan, dan target keuntungan.</p><label>Modal produk (Rp)</label><input id="m" type="number" min="0" placeholder="50000"><label>Biaya tambahan (Rp)</label><input id="b" type="number" min="0" placeholder="5000"><label>Target keuntungan (%)</label><input id="u" type="number" min="0" placeholder="20"><button onclick="calc()">Hitung Harga</button><div id="r" class="result">Hasil akan muncul di sini.</div><a class="back" href="/">← Kembali ke NBBNTOOLS</a></div></main><script>const f=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);function calc(){let m=+document.getElementById('m').value||0,b=+document.getElementById('b').value||0,u=+document.getElementById('u').value||0,d=m+b,h=d*(1+u/100);document.getElementById('r').textContent='Modal + biaya: '+f(d)+'\nHarga jual: '+f(h)+'\nPerkiraan keuntungan: '+f(h-d)}</script></body></html>
