<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator harga jual gratis berdasarkan modal, biaya tambahan, dan markup keuntungan."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/harga-jual/"><link rel="stylesheet" href="/assets/style.css"><title>Kalkulator Harga Jual — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Harga Jual</h1><p>Masukkan nominal dengan mudah. Pemisah ribuan otomatis menggunakan format Indonesia.</p><label for="m">Modal (Rp)</label><input id="m" class="money" inputmode="numeric" autocomplete="off" placeholder="0"><label for="b">Biaya tambahan (Rp)</label><input id="b" class="money" inputmode="numeric" autocomplete="off" placeholder="0"><label for="u">Markup keuntungan (%)</label><input id="u" type="number" min="0" step=".01" inputmode="decimal" placeholder="20"><div class="actions"><button class="primary" id="calc" type="button">Hitung</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div></section></main><script>const m=document.getElementById('m'),b=document.getElementById('b'),u=document.getElementById('u'),r=document.getElementById('r'),copyBtn=document.getElementById('copy');const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);const raw=el=>Number(String(el.value).replace(/\D/g,''))||0;function formatMoney(el){const n=raw(el);el.value=n?new Intl.NumberFormat('id-ID').format(n):''}document.querySelectorAll('.money').forEach(el=>el.addEventListener('input',()=>formatMoney(el)));document.getElementById('calc').addEventListener('click',()=>{const modal=raw(m),extra=raw(b),markup=Number(u.value);if(modal<=0){r.textContent='Masukkan modal lebih dari Rp0.';return}if(!Number.isFinite(extra)||extra<0){r.textContent='Biaya tambahan tidak valid.';return}if(!Number.isFinite(markup)||markup<0){r.textContent='Markup harus 0% atau lebih.';return}const total=modal+extra,price=total*(1+markup/100);if(!Number.isFinite(price)||!Number.isSafeInteger(Math.round(price))){r.textContent='Nilai terlalu besar untuk dihitung dengan aman.';return}r.textContent=`Total biaya: ${money(total)}\nHarga jual: ${money(price)}\nPerkiraan laba: ${money(price-total)}`});copyBtn.addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copyBtn.textContent='Tersalin ✓';setTimeout(()=>copyBtn.textContent='Salin',1500)}catch(e){copyBtn.textContent='Gagal menyalin';setTimeout(()=>copyBtn.textContent='Salin',1800)}});document.getElementById('reset').addEventListener('click',()=>{m.value='';b.value='';u.value='';r.textContent='Hasil akan muncul di sini.';copyBtn.textContent='Salin';m.focus()});</script></body></html>
