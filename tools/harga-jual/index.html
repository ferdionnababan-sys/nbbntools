<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator harga jual gratis berdasarkan modal, biaya tambahan, dan markup keuntungan."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/harga-jual/"><link rel="stylesheet" href="/assets/style.css"><title>Kalkulator Harga Jual — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Harga Jual</h1><p>Masukkan nominal dengan mudah. Pemisah ribuan otomatis menggunakan format Indonesia.</p><label for="m">Modal (Rp)</label><input id="m" class="money" inputmode="numeric" autocomplete="off" placeholder="0"><label for="b">Biaya tambahan (Rp)</label><input id="b" class="money" inputmode="numeric" autocomplete="off" placeholder="0"><label for="u">Markup keuntungan (%)</label><input id="u" type="number" min="0" step=".01" inputmode="decimal" placeholder="20"><div class="actions"><button class="primary" id="calc">Hitung</button><button class="secondary" id="copy">Salin</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div></section></main><script>const m=document.getElementById('m'),b=document.getElementById('b'),u=document.getElementById('u'),r=document.getElementById('r');const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);const raw=el=>Number(String(el.value).replace(/\D/g,''))||0;function formatMoney(el){const n=raw(el);el.value=n?new Intl.NumberFormat('id-ID').format(n):''}document.querySelectorAll('.money').forEach(el=>el.addEventListener('input',()=>formatMoney(el)));document.getElementById('calc').addEventListener('click',()=>{const total=raw(m)+raw(b),markup=Math.max(0,Number(u.value)||0),price=total*(1+markup/100);r.textContent=`Total biaya: ${money(total)}\nHarga jual: ${money(price)}\nPerkiraan laba: ${money(price-total)}`});document.getElementById('copy').addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}});</script></body></html>
