<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator harga jual gratis berdasarkan modal, biaya tambahan, dan markup keuntungan."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/harga-jual/"><link rel="stylesheet" href="/assets/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Harga Jual — NBBNTOOLS","url":"https://nbbntools.my.id/tools/harga-jual/","applicationCategory":"BusinessApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Harga Jual — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Harga Jual</h1><p>Hitung harga jual dari total biaya dan target markup.</p><div class="row"><div><label>Modal (Rp)</label><input id="m" type="number" min="0"></div><div><label>Biaya tambahan (Rp)</label><input id="b" type="number" min="0"></div></div><label>Markup keuntungan (%)</label><input id="u" type="number" min="0" step=".01"><div class="actions"><button class="primary" onclick="go()">Hitung</button></div><div id="r" class="result">Hasil akan muncul di sini.</div><p class="note">Rumus: total biaya × (1 + markup/100).</p></section></main><script>const f=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);function go(){let m=+document.getElementById('m').value||0,b=+document.getElementById('b').value||0,u=Math.max(0,+document.getElementById('u').value||0),x=m+b,p=x*(1+u/100);r.textContent=`Total biaya: ${f(x)}\nHarga jual: ${f(p)}\nPerkiraan laba: ${f(p-x)}`}</script></body></html>
