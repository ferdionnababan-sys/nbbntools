<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator umur gratis berdasarkan tanggal lahir."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/umur/"><link rel="stylesheet" href="/assets/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Umur — NBBNTOOLS","url":"https://nbbntools.my.id/tools/umur/","applicationCategory":"UtilitiesApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Umur — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Umur</h1><p>Hitung usia berdasarkan tanggal lahir.</p><label for="d">Tanggal lahir</label><input id="d" type="date"><div class="actions"><button class="primary" onclick="go()">Hitung Umur</button><button class="secondary" onclick="copyResult()">Salin</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div></section></main><script>function go(){const v=document.getElementById('d').value;if(!v){document.getElementById('r').textContent='Pilih tanggal lahir.';return}const b=new Date(v+'T00:00:00'),t=new Date();if(b>t){document.getElementById('r').textContent='Tanggal lahir tidak boleh di masa depan.';return}let y=t.getFullYear()-b.getFullYear(),m=t.getMonth()-b.getMonth(),x=t.getDate()-b.getDate();if(x<0){m--;x+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(m<0){y--;m+=12}document.getElementById('r').textContent=`Umur: ${y} tahun, ${m} bulan, ${x} hari.`}async function copyResult(){const text=document.getElementById('r').textContent;if(text==='Hasil akan muncul di sini.')return;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}</script></body></html>
