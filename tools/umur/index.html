<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator umur gratis berdasarkan tanggal lahir."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/umur/"><link rel="stylesheet" href="/assets/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Umur — NBBNTOOLS","url":"https://nbbntools.my.id/tools/umur/","applicationCategory":"UtilitiesApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Umur — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Umur</h1><p>Hitung usia berdasarkan tanggal lahir.</p><label for="d">Tanggal lahir</label><input id="d" type="date"><div class="actions"><button class="primary" id="calc" type="button">Hitung Umur</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div></section></main><script>const d=document.getElementById('d'),r=document.getElementById('r'),copy=document.getElementById('copy');function startOfDay(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate())}function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}function go(){if(!d.value){r.textContent='Pilih tanggal lahir.';return}const [yy,mm,dd]=d.value.split('-').map(Number);if(!Number.isInteger(yy)||!Number.isInteger(mm)||!Number.isInteger(dd)){r.textContent='Tanggal lahir tidak valid.';return}const b=new Date(yy,mm-1,dd),t=startOfDay(new Date());if(b.getFullYear()!==yy||b.getMonth()!==mm-1||b.getDate()!==dd){r.textContent='Tanggal lahir tidak valid.';return}if(b>t){r.textContent='Tanggal lahir tidak boleh di masa depan.';return}let y=t.getFullYear()-yy,m=t.getMonth()-(mm-1),x=t.getDate()-dd;if(x<0){m--;x+=daysInMonth(t.getFullYear(),t.getMonth()-1)}if(m<0){y--;m+=12}r.textContent=`Umur: ${y} tahun, ${m} bulan, ${x} hari.`}document.getElementById('calc').addEventListener('click',go);copy.addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){copy.textContent='Gagal menyalin';setTimeout(()=>copy.textContent='Salin',1800)}});document.getElementById('reset').addEventListener('click',()=>{d.value='';r.textContent='Hasil akan muncul di sini.';copy.textContent='Salin';d.focus()});</script></body></html>
