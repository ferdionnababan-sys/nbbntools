sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');if(document.getElementById('d').checked)sets.push('0123456789');if(document.getElementById('s').checked)sets.push('!@#$%^&*()-_=+[]{}');const r=document.getElementById('r');if(!sets.length){r.textContent='Pilih minimal satu jenis karakter.';return}const requested=Number(document.getElementById('n').value);const n=Math.min(128,Math.max(4,Number.isFinite(requested)?Math.floor(requested):16)),all=sets.join(''),a=[];sets.forEach(q=>a.push(q[randomIndex(q.length)]));while(a.length<n)a.push(all[randomIndex(all.length)]);for(let i=a.length-1;i>0;i--){const j=randomIndex(i+1);[a[i],a[j]]=[a[j],a[i]]}r.textContent=a.join('')}async function copyResult(){const text=document.getElementById('r').textContent;if(text==='Password akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}catch(e){}}go()</script></body></html>
