"checkbox" checked> Simbol</label><div class="actions"><button class="primary" id="generate" type="button">Generate</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">Password akan muncul di sini.</div><p id="status" class="note" aria-live="polite">Gunakan password unik untuk akun penting dan simpan dengan password manager.</p></section></main><script>const n=document.getElementById('n'),l=document.getElementById('l'),u=document.getElementById('u'),d=document.getElementById('d'),s=document.getElementById('s'),r=document.getElementById('r'),copy=document.getElementById('copy'),status=document.getElementById('status');function randomIndex(max){if(!Number.isInteger(max)||max<1)throw new Error('Invalid random range');const limit=Math.floor(4294967296/max)*max,x=new Uint32Array(1);do{crypto.getRandomValues(x)}while(x[0]>=limit);return x[0]%max}function generate(){const sets=[];if(l.checked)sets.push('abcdefghijklmnopqrstuvwxyz');if(u.checked)sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');if(d.checked)sets.push('0123456789');if(s.checked)sets.push('!@#$%^&*()-_=+[]{}');if(!sets.length){r.textContent='Pilih minimal satu jenis karakter.';status.textContent='';return}let requested=Number(n.value);if(!Number.isFinite(requested))requested=16;const length=Math.min(128,Math.max(4,Math.floor(requested)));n.value=length;const all=sets.join(''),chars=[];sets.forEach(set=>chars.push(set[randomIndex(set.length)]));while(chars.length<length)chars.push(all[randomIndex(all.length)]);for(let i=chars.length-1;i>0;i--){const j=randomIndex(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]}r.textContent=chars.join('');status.textContent='Password dibuat secara lokal di perangkat ini.'}async function copyPassword(){const text=r.textContent;if(text==='Password akan muncul di sini.'||!text)return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';status.textContent='Password berhasil disalin. Hindari membagikannya.';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){status.textContent='Gagal menyalin password. Silakan salin secara manual.'}}document.getElementById('generate').addEventListener('click',generate);copy.addEventListener('click',copyPassword);document.getElementById('reset').addEventListener('click',()=>{n.value=16;l.checked=true;u.checked=true;d.checked=true;s.checked=true;r.textContent='Password akan muncul di sini.';copy.textContent='Salin';status.textContent='Gunakan password unik untuk akun penting dan simpan dengan password manager.';n.focus()});generate();</script></body></html>
