<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Password Generator gratis untuk membuat password acak yang kuat langsung di browser."><link rel="canonical" href="https://nbbntools.my.id/tools/password-generator/"><title>Password Generator — NBBNTOOLS</title><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#172033}.nav{padding:18px 6%;background:#fff;border-bottom:1px solid #e7eaf1}.brand{font-weight:800;font-size:22px}.brand span{color:#5b5cf0}.wrap{max-width:760px;margin:50px auto;padding:0 20px}.box{background:#fff;border:1px solid #e7eaf1;border-radius:22px;padding:28px}h1{font-size:42px;margin:0 0 10px}p{color:#667085;line-height:1.7}input[type=number]{width:100%;padding:13px;border:1px solid #dfe3eb;border-radius:10px;box-sizing:border-box}.checks{display:grid;gap:10px;margin-top:18px}.out{margin-top:18px;padding:16px;background:#f1f2ff;border-radius:12px;word-break:break-all;font-family:ui-monospace,monospace}.row{display:flex;gap:10px;flex-wrap:wrap}button{margin-top:18px;padding:12px 16px;border:0;border-radius:11px;background:#5b5cf0;color:#fff;font-weight:800}.secondary{background:#eef0ff;color:#4f46e5}.back{display:block;margin-top:20px;color:#5b5cf0}</style></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a></nav><main class="wrap"><div class="box"><h1>Password Generator</h1><p>Buat password acak langsung di perangkat. Tidak ada password yang dikirim ke server.</p><label>Panjang password</label><input id="len" type="number" min="4" max="128" value="16"><div class="checks"><label><input id="up" type="checkbox" checked> Huruf besar</label><label><input id="lo" type="checkbox" checked> Huruf kecil</label><label><input id="nu" type="checkbox" checked> Angka</label><label><input id="sy" type="checkbox" checked> Simbol</label></div><div class="row"><button onclick="gen()">Generate</button><button class="secondary" onclick="copyP()">Salin</button></div><div id="out" class="out">Tekan Generate untuk membuat password.</div><a class="back" href="/">← Kembali ke NBBNTOOLS</a></div></main><script>function gen(){let chars='';if(up.checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(lo.checked)chars+='abcdefghijklmnopqrstuvwxyz';if(nu.checked)chars+='0123456789';if(sy.checked)chars+='!@#$%^&*()-_=+[]{}';let n=Math.min(128,Math.max(4,+len.value||16));if(!chars){out.textContent='Pilih minimal satu jenis karakter.';return}let a=new Uint32Array(n);crypto.getRandomValues(a);let s='';for(let i=0;i<n;i++)s+=chars[a[i]%chars.length];out.textContent=s}async function copyP(){try{await navigator.clipboard.writeText(out.textContent)}catch(e){}}</script></body></html>
