<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JSON Formatter gratis NBBNTOOLS untuk memformat, memperkecil, dan memvalidasi JSON langsung di browser."><link rel="canonical" href="https://nbbntools.my.id/tools/json-formatter/"><title>JSON Formatter & Minifier — NBBNTOOLS</title><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#172033}.nav{padding:18px 6%;background:#fff;border-bottom:1px solid #e7eaf1}.brand{font-weight:800;font-size:22px}.brand span{color:#5b5cf0}.wrap{max-width:900px;margin:45px auto;padding:0 20px}.box{background:#fff;border:1px solid #e7eaf1;border-radius:22px;padding:28px}h1{font-size:42px;margin:0 0 10px}p{color:#667085;line-height:1.7}textarea{width:100%;min-height:330px;padding:14px;border:1px solid #dfe3eb;border-radius:12px;box-sizing:border-box;font-family:ui-monospace,monospace;resize:vertical}button{margin:12px 8px 0 0;padding:12px 16px;border:0;border-radius:11px;background:#5b5cf0;color:#fff;font-weight:800}.secondary{background:#eef0ff;color:#4f46e5}.result{margin-top:15px;padding:12px;border-radius:10px;background:#f5f6ff}.back{display:block;margin-top:20px;color:#5b5cf0}</style></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a></nav><main class="wrap"><div class="box"><h1>JSON Formatter</h1><p>Format, minify, dan validasi JSON langsung di browser. Data tidak perlu dikirim ke server.</p><textarea id="j" spellcheck="false" placeholder='{"nama":"NBBNTOOLS","aktif":true}'></textarea><br><button onclick="fmt()">Format</button><button class="secondary" onclick="mini()">Minify</button><button class="secondary" onclick="copyJ()">Salin</button><div id="r" class="result">Status JSON akan muncul di sini.</div><a class="back" href="/">← Kembali ke NBBNTOOLS</a></div></main><script>function parse(){try{return JSON.parse(document.getElementById('j').value)}catch(e){document.getElementById('r').textContent='❌ JSON tidak valid: '+e.message;return null}}function fmt(){let x=parse();if(x!==null){document.getElementById('j').value=JSON.stringify(x,null,2);document.getElementById('r').textContent='✅ JSON valid dan sudah diformat.'}}function mini(){let x=parse();if(x!==null){document.getElementById('j').value=JSON.stringify(x);document.getElementById('r').textContent='✅ JSON valid dan sudah diminify.'}}async function copyJ(){try{await navigator.clipboard.writeText(document.getElementById('j').value);document.getElementById('r').textContent='✅ Berhasil disalin.'}catch(e){document.getElementById('r').textContent='Salin manual dari kotak JSON.'}}</script></body></html>
