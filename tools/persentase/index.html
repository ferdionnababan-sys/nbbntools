<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator persentase gratis untuk menghitung nilai persentase dan perubahan persentase."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/persentase/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Persentase — NBBNTOOLS","url":"https://nbbntools.my.id/tools/persentase/","applicationCategory":"UtilitiesApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Persentase — NBBNTOOLS</title><link rel="stylesheet" href="/assets/style.css"></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Persentase</h1><p>Gunakan tiga mode perhitungan persentase umum.</p><label for="mode">Mode</label><select id="mode"><option value="of">X% dari Y</option><option value="what">X adalah berapa % dari Y</option><option value="change">Perubahan X ke Y</option></select><div class="row"><div><label for="a">X / nilai awal</label><input id="a" type="number" step="any"></div><div><label for="b">Y / nilai akhir</label><input id="b" type="number" step="any"></div></div><div class="actions"><button class="primary" onclick="go()">Hitung</button><button class="secondary" onclick="copyResult()">Salin</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div></section></main><script>function go(){const a=Number(document.getElementById('a').value),b=Number(document.getElementById('b').value),m=document.getElementById('mode').value,r=document.getElementById('r');if(!Number.isFinite(a)||!Number.isFinite(b)){r.textContent='Masukkan angka yang valid.';return}if(m==='of'){r.textContent=`${a}% dari ${b} = ${b*a/100}`}else if(m==='what'){r.textContent=b===0?'Y tidak boleh 0 untuk mode ini.':`${a} adalah ${a/b*100}% dari ${b}`}else{r.textContent=a===0?'Nilai awal tidak boleh 0 untuk menghitung perubahan.':`Perubahan = ${((b-a)/Math.abs(a))*100}%`}}async function copyResult(){const text=document.getElementById('r').textContent;if(text==='Hasil akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}catch(e){}}</script></body></html>
