<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator persentase gratis untuk menghitung nilai persentase dan perubahan persentase."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/persentase/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Persentase — NBBNTOOLS","url":"https://nbbntools.my.id/tools/persentase/","applicationCategory":"UtilitiesApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Persentase — NBBNTOOLS</title><link rel="stylesheet" href="/assets/style.css"></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Persentase</h1><p>Gunakan tiga mode perhitungan persentase umum.</p><label for="mode">Mode</label><select id="mode"><option value="of">X% dari Y</option><option value="what">X adalah berapa % dari Y</option><option value="change">Perubahan X ke Y</option></select><div class="row"><div><label for="a">X / nilai awal</label><input id="a" type="number" step="any" inputmode="decimal"></div><div><label for="b">Y / nilai akhir</label><input id="b" type="number" step="any" inputmode="decimal"></div></div><div class="actions"><button class="primary" id="calc" type="button">Hitung</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div></section></main><script>const mode=document.getElementById('mode'),a=document.getElementById('a'),b=document.getElementById('b'),r=document.getElementById('r'),copy=document.getElementById('copy');const clean=n=>Number.isInteger(n)?String(n):n.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');document.getElementById('calc').addEventListener('click',()=>{const x=Number(a.value),y=Number(b.value),m=mode.value;if(!Number.isFinite(x)||!Number.isFinite(y)){r.textContent='Masukkan angka yang valid.';return}if(m==='of'){r.textContent=`${clean(x)}% dari ${clean(y)} = ${clean(y*x/100)}`}else if(m==='what'){r.textContent=y===0?'Y tidak boleh 0 untuk mode ini.':`${clean(x)} adalah ${clean(x/y*100)}% dari ${clean(y)}`}else{r.textContent=x===0?'Nilai awal tidak boleh 0 untuk menghitung perubahan.':`Perubahan = ${clean((y-x)/Math.abs(x)*100)}%`}});copy.addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){copy.textContent='Gagal menyalin';setTimeout(()=>copy.textContent='Salin',1800)}});document.getElementById('reset').addEventListener('click',()=>{a.value='';b.value='';mode.value='of';r.textContent='Hasil akan muncul di sini.';copy.textContent='Salin';mode.focus()});</script></body></html>
