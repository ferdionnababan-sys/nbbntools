<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator persentase gratis untuk menghitung nilai persentase dan perubahan persentase."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/persentase/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Persentase — NBBNTOOLS","url":"https://nbbntools.my.id/tools/persentase/","applicationCategory":"UtilitiesApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Persentase — NBBNTOOLS</title><link rel="stylesheet" href="/assets/style.css"></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Persentase</h1><p>Gunakan tiga mode perhitungan persentase umum.</p><label for="mode">Mode</label><select id="mode"><option value="of">X% dari Y</option><option value="what">X adalah berapa % dari Y</option><option value="change">Perubahan X ke Y</option></select><div class="row"><div><label id="la" for="a">X / persentase</label><input id="a" type="number" step="any" inputmode="decimal"></div><div><label id="lb" for="b">Y / nilai</label><input id="b" type="number" step="any" inputmode="decimal"></div></div><div class="actions"><button class="primary" id="calc" type="button">Hitung</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div></section></main><script>const mode=document.getElementById('mode'),a=document.getElementById('a'),b=document.getElementById('b'),r=document.getElementById('r'),copy=document.getElementById('copy'),la=document.getElementById('la'),lb=document.getElementById('lb');const clean=n=>{if(!Number.isFinite(n))return '';if(Number.isInteger(n))return String(n);return Number(n.toPrecision(12)).toString()};const updateLabels=()=>{if(mode.value==='of'){la.textContent='X / persentase (%)';lb.textContent='Y / nilai'}else if(mode.value==='what'){la.textContent='X / nilai';lb.textContent='Y / pembanding'}else{la.textContent='X / nilai awal';lb.textContent='Y / nilai akhir'}};mode.addEventListener('change',updateLabels);document.getElementById('calc').addEventListener('click',()=>{const x=Number(a.value),y=Number(b.value),m=mode.value;if(!Number.isFinite(x)||!Number.isFinite(y)){r.textContent='Masukkan angka yang valid.';return}let result;if(m==='of'){result=y*x/100;if(!Number.isFinite(result)){r.textContent='Hasil terlalu besar untuk dihitung dengan aman.';return}r.textContent=`${clean(x)}% dari ${clean(y)} = ${clean(result)}`}else if(m==='what'){if(y===0){r.textContent='Y tidak boleh 0 untuk mode ini.';return}result=x/y*100;if(!Number.isFinite(result)){r.textContent='Hasil terlalu besar untuk dihitung dengan aman.';return}r.textContent=`${clean(x)} adalah ${clean(result)}% dari ${clean(y)}`}else{if(x===0){r.textContent='Nilai awal tidak boleh 0 untuk menghitung perubahan.';return}result=(y-x)/Math.abs(x)*100;if(!Number.isFinite(result)){r.textContent='Hasil terlalu besar untuk dihitung dengan aman.';return}r.textContent=`Perubahan = ${clean(result)}%`}});copy.addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){copy.textContent='Gagal menyalin';setTimeout(()=>copy.textContent='Salin',1800)}});document.getElementById('reset').addEventListener('click',()=>{a.value='';b.value='';mode.value='of';r.textContent='Hasil akan muncul di sini.';copy.textContent='Salin';updateLabels();mode.focus()});updateLabels();</script></body></html>
