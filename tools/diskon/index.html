<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator diskon gratis untuk menghitung potongan dan harga setelah diskon."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/diskon/"><link rel="stylesheet" href="/assets/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Diskon — NBBNTOOLS","url":"https://nbbntools.my.id/tools/diskon/","applicationCategory":"BusinessApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Diskon — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Diskon</h1><p>Hitung jumlah potongan dan harga setelah diskon.</p><div class="row"><div><label>Harga awal (Rp)</label><input id="h" type="number" min="0"></div><div><label>Diskon (%)</label><input id="d" type="number" min="0" max="100" step=".01"></div></div><div class="actions"><button class="primary" onclick="go()">Hitung Diskon</button></div><div id="r" class="result">Hasil akan muncul di sini.</div></section></main><script>const f=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);function go(){let h=Math.max(0,+document.getElementById('h').value||0),d=Math.min(100,Math.max(0,+document.getElementById('d').value||0)),s=h*d/100;r.textContent=`Potongan: ${f(s)}\nHarga setelah diskon: ${f(h-s)}`}</script></body></html>
