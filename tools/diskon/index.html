<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator diskon gratis untuk menghitung potongan dan harga setelah diskon."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/diskon/"><link rel="stylesheet" href="/assets/style.css"><title>Kalkulator Diskon — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Diskon</h1><p>Masukkan harga dengan format Indonesia. Pemisah ribuan otomatis.</p><label for="h">Harga awal (Rp)</label><input id="h" class="money" inputmode="numeric" autocomplete="off" placeholder="0"><label for="d">Diskon (%)</label><input id="d" type="number" min="0" max="100" step=".01" inputmode="decimal" placeholder="10"><div class="actions"><button class="primary" id="calc">Hitung Diskon</button><button class="secondary" id="copy">Salin</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div></section></main><script>const h=document.getElementById('h'),d=document.getElementById('d'),r=document.getElementById('r');const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);const raw=el=>Number(String(el.value).replace(/\D/g,''))||0;h.addEventListener('input',()=>{const n=raw(h);h.value=n?new Intl.NumberFormat('id-ID').format(n):''});document.getElementById('calc').addEventListener('click',()=>{const price=raw(h),disc=Math.min(100,Math.max(0,Number(d.value)||0)),cut=price*disc/100;r.textContent=`Harga awal: ${money(price)}\nPotongan: ${money(cut)}\nHarga setelah diskon: ${money(price-cut)}`});document.getElementById('copy').addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}});</script></body></html>
