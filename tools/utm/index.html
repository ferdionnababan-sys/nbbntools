<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="UTM Link Builder gratis untuk membuat URL kampanye pemasaran."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/utm/"><link rel="stylesheet" href="/assets/style.css"><title>UTM Link Builder — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>UTM Link Builder</h1><p>Buat URL kampanye dengan parameter UTM.</p><label>URL tujuan</label><input id="u" type="url" placeholder="https://contoh.com/produk"><div class="row"><div><label>Source</label><input id="s" placeholder="tiktok"></div><div><label>Medium</label><input id="m" placeholder="social"></div></div><div class="row"><div><label>Campaign</label><input id="c" placeholder="promo"></div><div><label>Content</label><input id="ct" placeholder="video-1"></div></div><div class="actions"><button class="primary" onclick="go()">Buat URL</button><button class="secondary" onclick="navigator.clipboard.writeText(r.textContent)">Salin</button></div><div id="r" class="result">URL akan muncul di sini.</div></section></main><script>function go(){try{let x=new URL(u.value);[['utm_source',s],['utm_medium',m],['utm_campaign',c],['utm_content',ct]].forEach(([k,e])=>{if(e.value.trim())x.searchParams.set(k,e.value.trim())});r.textContent=x.href}catch(e){r.textContent='URL tidak valid. Gunakan https://...';}}</script></body></html>
