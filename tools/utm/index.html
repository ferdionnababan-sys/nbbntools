<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="UTM Link Builder gratis untuk membuat URL kampanye pemasaran."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/utm/"><link rel="stylesheet" href="/assets/style.css"><title>UTM Link Builder — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>UTM Link Builder</h1><p>Buat URL kampanye dengan parameter UTM.</p><label for="u">URL tujuan</label><input id="u" type="url" placeholder="https://contoh.com/produk"><div class="row"><div><label for="s">Source</label><input id="s" placeholder="tiktok"></div><div><label for="m">Medium</label><input id="m" placeholder="social"></div></div><div class="row"><div><label for="c">Campaign</label><input id="c" placeholder="promo"></div><div><label for="ct">Content</label><input id="ct" placeholder="video-1"></div></div><div class="actions"><button class="primary" onclick="go()">Buat URL</button><button class="secondary" onclick="copyResult()">Salin</button></div><div id="r" class="result" aria-live="polite">URL akan muncul di sini.</div></section></main><script>function go(){const r=document.getElementById('r');try{const x=new URL(document.getElementById('u').value);[['utm_source','s'],['utm_medium','m'],['utm_campaign','c'],['utm_content','ct']].forEach(([k,id])=>{const v=document.getElementById(id).value.trim();if(v)x.searchParams.set(k,v)});r.textContent=x.href}catch(e){r.textContent='URL tidak valid. Gunakan https://...'}}async function copyResult(){const text=document.getElementById('r').textContent;if(text==='URL akan muncul di sini.')return;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}</script></body></html>
