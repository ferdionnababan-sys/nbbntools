<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Random Number Generator gratis untuk menghasilkan angka acak dalam rentang tertentu."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/random/"><link rel="stylesheet" href="/assets/style.css"><title>Random Number Generator — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Random Number Generator</h1><p>Hasilkan angka acak dari minimum sampai maksimum.</p><div class="row"><div><label for="a">Minimum</label><input id="a" type="number" value="1" step="1" inputmode="numeric"></div><div><label for="b">Maksimum</label><input id="b" type="number" value="100" step="1" inputmode="numeric"></div></div><div class="actions"><button class="primary" id="generate" type="button">Acak Angka</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">—</div><p id="status" class="note" aria-live="polite"></p></section></main><script>const a=document.getElementById('a'),b=document.getElementById('b'),r=document.getElementById('r'),copy=document.getElementById('copy'),status=document.getElementById('status');function go(){let x=Number(a.value),y=Number(b.value);if(!Number.isFinite(x)||!Number.isFinite(y)){r.textContent='Masukkan angka yang valid.';status.textContent='';return}x=Math.ceil(x);y=Math.floor(y);if(x>y)[x,y]=[y,x];if(x===y){r.textContent=String(x);status.textContent='Rentang hanya memiliki satu angka.';return}const span=y-x+1;if(!Number.isSafeInteger(span)){r.textContent='Rentang terlalu besar untuk diproses dengan aman.';status.textContent='Perkecil rentang angka.';return}r.textContent=String(Math.floor(Math.random()*span)+x);status.textContent=`Angka acak dari ${x} sampai ${y}.`}document.getElementById('generate').addEventListener('click',go);copy.addEventListener('click',async()=>{const text=r.textContent;if(text==='—'||!text)return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){copy.textContent='Gagal menyalin';setTimeout(()=>copy.textContent='Salin',1800)}});document.getElementById('reset').addEventListener('click',()=>{a.value=1;b.value=100;r.textContent='—';status.textContent='';copy.textContent='Salin';a.focus()});</script></body></html>
