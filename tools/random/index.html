<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Random Number Generator gratis untuk menghasilkan angka acak dalam rentang tertentu."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/random/"><link rel="stylesheet" href="/assets/style.css"><title>Random Number Generator — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Random Number Generator</h1><p>Hasilkan angka acak dari minimum sampai maksimum.</p><div class="row"><div><label for="a">Minimum</label><input id="a" type="number" value="1"></div><div><label for="b">Maksimum</label><input id="b" type="number" value="100"></div></div><div class="actions"><button class="primary" onclick="go()">Acak Angka</button></div><div id="r" class="result" aria-live="polite">—</div></section></main><script>function go(){let a=Number(document.getElementById('a').value),b=Number(document.getElementById('b').value);if(!Number.isFinite(a))a=0;if(!Number.isFinite(b))b=0;a=Math.ceil(a);b=Math.floor(b);if(a>b)[a,b]=[b,a];document.getElementById('r').textContent=String(Math.floor(Math.random()*(b-a+1))+a)}</script></body></html>
