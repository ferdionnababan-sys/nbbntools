<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator profit dan margin gratis untuk bisnis online."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/profit/"><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><meta property="og:title" content="Kalkulator Profit &amp; Margin — NBBNTOOLS"><meta property="og:description" content="Kalkulator profit dan margin gratis untuk bisnis online."><meta property="og:url" content="https://nbbntools.my.id/tools/profit/"><meta property="og:type" content="website"><meta property="og:site_name" content="NBBNTOOLS"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Kalkulator Profit &amp; Margin — NBBNTOOLS"><meta name="twitter:description" content="Kalkulator profit dan margin gratis untuk bisnis online."><link rel="stylesheet" href="/assets/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Profit & Margin — NBBNTOOLS","url":"https://nbbntools.my.id/tools/profit/","applicationCategory":"UtilitiesApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Profit &amp; Margin — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Profit &amp; Margin</h1><p>Hitung laba, margin, dan markup produk. Nominal otomatis menggunakan format ribuan Indonesia.</p><div class="row"><div><label for="a">Modal / biaya (Rp)</label><input id="a" class="money" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div><div><label for="b">Harga jual (Rp)</label><input id="b" class="money" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div></div><div class="actions"><button class="primary" id="calc" type="button">Hitung</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div><div class="links"><a href="/">NBBNTOOLS</a><a href="/privacy/">Privasi</a></div></section></main><footer class="footer">© 2026 NBBNTOOLS</footer><script>const a=document.getElementById('a'),b=document.getElementById('b'),r=document.getElementById('r'),copy=document.getElementById('copy');const f=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);const raw=el=>Number(String(el.value).replace(/\D/g,''))||0;const fmt=el=>{const n=raw(el);el.value=n?new Intl.NumberFormat('id-ID').format(n):''};document.querySelectorAll('.money').forEach(el=>el.addEventListener('input',()=>fmt(el)));document.getElementById('calc').addEventListener('click',()=>{const cost=raw(a),price=raw(b);if(!Number.isSafeInteger(cost)||cost<=0||!Number.isSafeInteger(price)||price<=0){r.textContent='Masukkan modal/biaya dan harga jual yang valid, lebih dari Rp0.';return}const profit=price-cost,margin=profit/price*100,markup=profit/cost*100;if(!Number.isFinite(profit)||!Number.isFinite(margin)||!Number.isFinite(markup)){r.textContent='Nilai terlalu besar untuk dihitung dengan aman.';return}r.textContent=`Laba: ${f(profit)}\nMargin: ${margin.toFixed(2)}%\nMarkup: ${markup.toFixed(2)}%`});copy.addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){copy.textContent='Gagal menyalin';setTimeout(()=>copy.textContent='Salin',1800)}});document.getElementById('reset').addEventListener('click',()=>{a.value='';b.value='';r.textContent='Hasil akan muncul di sini.';copy.textContent='Salin';a.focus()});</script></body></html>
