.toFixed(2):0}%\nMarkup: ${cost?(profit/cost*100).toFixed(2):0}%`});document.getElementById('copy').addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove()}alert('Hasil berhasil disalin.')}catch(e){alert('Penyalinan tidak tersedia di browser ini. Silakan salin hasil secara manual.')}});</script></body></html>
