<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kalkulator profit dan margin gratis untuk bisnis online."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/profit/"><link rel="stylesheet" href="/assets/style.css"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulator Profit & Margin — NBBNTOOLS","url":"https://nbbntools.my.id/tools/profit/","applicationCategory":"UtilitiesApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"IDR"}}</script><title>Kalkulator Profit & Margin — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Kalkulator Profit & Margin</h1><p>Hitung laba, margin, dan markup produk. Nominal otomatis menggunakan format ribuan Indonesia.</p><div class="row"><div><label for="a">Modal / biaya (Rp)</label><input id="a" class="money" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div><div><label for="b">Harga jual (Rp)</label><input id="b" class="money" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div></div><div class="actions"><button class="primary" id="calc">Hitung</button><button class="secondary" id="copy">Salin</button></div><div id="r" class="result" aria-live="polite">Hasil akan muncul di sini.</div><div class="links"><a href="/">NBBNTOOLS</a><a href="/privacy/">Privasi</a></div></section></main><footer class="footer">© 2026 NBBNTOOLS</footer><script>const a=document.getElementById('a'),b=document.getElementById('b'),r=document.getElementById('r');const f=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);const raw=el=>Number(String(el.value).replace(/\D/g,''))||0;const fmt=el=>{const n=raw(el);el.value=n?new Intl.NumberFormat('id-ID').format(n):''};document.querySelectorAll('.money').forEach(el=>el.addEventListener('input',()=>fmt(el)));document.getElementById('calc').addEventListener('click',()=>{const cost=raw(a),price=raw(b);if(cost<0||price<0){r.textContent='Masukkan nominal yang valid.';return}const profit=price-cost,margin=price?profit/price*100:null,markup=cost?profit/cost*100:null;r.textContent=`Laba: ${f(profit)}\nMargin: ${margin===null?'Tidak dapat dihitung':margin.toFixed(2)+'%'}\nMarkup: ${markup===null?'Tidak dapat dihitung karena modal Rp0':markup.toFixed(2)+'%'}`});document.getElementById('copy').addEventListener('click',async()=>{const text=r.textContent;if(text==='Hasil akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove()}alert('Hasil berhasil disalin.')}catch(e){alert('Penyalinan tidak tersedia di browser ini. Silakan salin hasil secara manual.')}});</script></body></html>
