<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generator caption promosi gratis untuk bisnis dan media sosial."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/caption/"><link rel="stylesheet" href="/assets/style.css"><title>Generator Caption — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Generator Caption</h1><p>Buat draft caption promosi tanpa akun.</p><label for="p">Nama produk</label><input id="p" placeholder="Kaos Oversize"><label for="k">Keunggulan</label><input id="k" placeholder="Nyaman dan adem"><label for="o">Penawaran</label><input id="o" placeholder="Mulai Rp79.000"><div class="actions"><button class="primary" onclick="go()">Buat Caption</button><button class="secondary" onclick="copyResult()">Salin</button></div><div id="r" class="result" aria-live="polite">Caption akan muncul di sini.</div></section></main><script>function go(){const p=document.getElementById('p').value,k=document.getElementById('k').value,o=document.getElementById('o').value;document.getElementById('r').textContent=`🔥 ${p||'Produk pilihan'}\n\n${k||'Berkualitas dan nyaman digunakan'}.\n\n💰 ${o||'Harga spesial'}\n\nCek produknya sekarang!\n\n#jualanonline #umkm #bisnisonline`}async function copyResult(){const text=document.getElementById('r').textContent;if(text==='Caption akan muncul di sini.')return;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}</script></body></html>
