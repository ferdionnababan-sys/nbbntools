<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generator caption promosi gratis untuk bisnis dan media sosial."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/caption/"><link rel="stylesheet" href="/assets/style.css"><title>Generator Caption — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Generator Caption</h1><p>Buat draft caption promosi tanpa akun.</p><label for="p">Nama produk</label><input id="p" placeholder="Kaos Oversize"><label for="k">Keunggulan</label><input id="k" placeholder="Nyaman dan adem"><label for="o">Penawaran</label><input id="o" placeholder="Mulai Rp79.000"><div class="actions"><button class="primary" id="generate" type="button">Buat Caption</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">Caption akan muncul di sini.</div><p id="status" class="note" aria-live="polite"></p></section></main><script>const p=document.getElementById('p'),k=document.getElementById('k'),o=document.getElementById('o'),r=document.getElementById('r'),copy=document.getElementById('copy'),status=document.getElementById('status');function go(){const product=p.value.trim()||'Produk pilihan',benefit=k.value.trim()||'Berkualitas dan nyaman digunakan',offer=o.value.trim()||'Harga spesial';r.textContent=`🔥 ${product}\n\n${benefit}.\n\n💰 ${offer}\n\nCek produknya sekarang!\n\n#jualanonline #umkm #bisnisonline`;status.textContent='Caption berhasil dibuat.'}document.getElementById('generate').addEventListener('click',go);copy.addEventListener('click',async()=>{const text=r.textContent;if(text==='Caption akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';status.textContent='Caption berhasil disalin.';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){status.textContent='Gagal menyalin caption.'}});document.getElementById('reset').addEventListener('click',()=>{p.value='';k.value='';o.value='';r.textContent='Caption akan muncul di sini.';status.textContent='';copy.textContent='Salin';p.focus()});</script></body></html>
