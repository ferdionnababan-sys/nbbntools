<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generator deskripsi produk gratis untuk toko online dan marketplace."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/deskripsi/"><link rel="stylesheet" href="/assets/style.css"><title>Generator Deskripsi Produk — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Generator Deskripsi Produk</h1><p>Buat draft deskripsi produk yang rapi dan mudah diedit.</p><label>Nama produk</label><input id="p"><label>Keunggulan</label><textarea id="k" placeholder="Bahan adem, jahitan rapi, ukuran lengkap"></textarea><label>Target pembeli</label><input id="t" placeholder="Anak muda"><div class="actions"><button class="primary" onclick="go()">Buat Draft</button><button class="secondary" onclick="navigator.clipboard.writeText(r.textContent)">Salin</button></div><div id="r" class="result">Draft akan muncul di sini.</div></section></main><script>function go(){let q=(k.value||'Berkualitas dan nyaman').split(/,|\n/).map(x=>x.trim()).filter(Boolean).map(x=>'• '+x).join('\n');r.textContent=`${p.value||'Produk pilihan'}\n\nPilihan tepat untuk ${t.value||'semua orang'}.\n\nKeunggulan:\n${q}\n\nPesan sekarang dan lengkapi kebutuhanmu.`}</script></body></html>
