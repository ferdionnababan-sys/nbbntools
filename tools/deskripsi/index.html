<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generator deskripsi produk gratis untuk toko online dan marketplace."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/deskripsi/"><link rel="stylesheet" href="/assets/style.css"><title>Generator Deskripsi Produk — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Generator Deskripsi Produk</h1><p>Buat draft deskripsi produk yang rapi dan mudah diedit.</p><label for="p">Nama produk</label><input id="p" placeholder="Nama produk"><label for="k">Keunggulan</label><textarea id="k" placeholder="Bahan adem, jahitan rapi, ukuran lengkap"></textarea><label for="t">Target pembeli</label><input id="t" placeholder="Anak muda"><div class="actions"><button class="primary" id="generate" type="button">Buat Draft</button><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div><div id="r" class="result" aria-live="polite">Draft akan muncul di sini.</div><p id="status" class="note" aria-live="polite"></p></section></main><script>const p=document.getElementById('p'),k=document.getElementById('k'),t=document.getElementById('t'),r=document.getElementById('r'),copy=document.getElementById('copy'),status=document.getElementById('status');function go(){const product=p.value.trim()||'Produk pilihan',target=t.value.trim()||'semua orang',items=(k.value||'Berkualitas dan nyaman').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);const list=items.map(x=>'• '+x).join('\n');r.textContent=`${product}\n\nPilihan tepat untuk ${target}.\n\nKeunggulan:\n${list}\n\nPesan sekarang dan lengkapi kebutuhanmu.`;status.textContent='Draft berhasil dibuat.'}document.getElementById('generate').addEventListener('click',go);copy.addEventListener('click',async()=>{const text=r.textContent;if(text==='Draft akan muncul di sini.')return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';status.textContent='Draft berhasil disalin.';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){status.textContent='Gagal menyalin draft.'}});document.getElementById('reset').addEventListener('click',()=>{p.value='';k.value='';t.value='';r.textContent='Draft akan muncul di sini.';status.textContent='';copy.textContent='Salin';p.focus()});</script></body></html>
