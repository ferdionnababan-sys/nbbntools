<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hitung kata, karakter, kalimat, paragraf, dan estimasi waktu baca secara gratis."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/kata/"><link rel="stylesheet" href="/assets/style.css"><title>Word & Character Counter — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Word &amp; Character Counter</h1><p>Analisis teks langsung di browser.</p><textarea id="t" oninput="go()" placeholder="Tempel atau ketik teks..."></textarea><div id="r" class="result">Kata: 0\nKarakter: 0\nKalimat: 0\nParagraf: 0\nEstimasi baca: 0 menit</div></section></main><script>function go(){let x=t.value,w=x.trim()?x.trim().split(/\s+/).length:0,s=x.trim()?x.split(/[.!?]+/).filter(Boolean).length:0,p=x.trim()?x.split(/\n\s*\n/).filter(Boolean).length:0;r.textContent=`Kata: ${w}\nKarakter: ${x.length}\nKalimat: ${s}\nParagraf: ${p}\nEstimasi baca: ${Math.ceil(w/200)} menit`}</script></body></html>
