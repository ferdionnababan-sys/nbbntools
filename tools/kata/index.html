<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hitung kata, karakter, kalimat, paragraf, dan estimasi waktu baca secara gratis."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nbbntools.my.id/tools/kata/"><link rel="stylesheet" href="/assets/style.css"><title>Word & Character Counter — NBBNTOOLS</title></head><body><nav class="nav"><a class="brand" href="/">NBBN<span>TOOLS</span></a><a href="/">← Semua Tools</a></nav><main class="wrap"><section class="box"><h1>Word &amp; Character Counter</h1><p>Analisis teks langsung di browser.</p><label for="t">Teks</label><textarea id="t" placeholder="Tempel atau ketik teks..."></textarea><div id="r" class="result" aria-live="polite">Kata: 0\nKarakter: 0\nKalimat: 0\nParagraf: 0\nEstimasi baca: 0 menit</div><div class="actions"><button class="secondary" id="copy" type="button">Salin</button><button class="secondary" id="reset" type="button">Reset</button></div></section></main><script>const t=document.getElementById('t'),r=document.getElementById('r'),copy=document.getElementById('copy');function go(){const x=t.value.trim(),w=x?x.split(/\s+/u).length:0,s=x?x.split(/[.!?]+/u).filter(v=>v.trim()).length:0,p=x?x.split(/\n\s*\n/u).filter(v=>v.trim()).length:0;r.textContent=`Kata: ${w}\nKarakter: ${t.value.length}\nKarakter tanpa spasi: ${t.value.replace(/\s/gu,'').length}\nKalimat: ${s}\nParagraf: ${p}\nEstimasi baca: ${w?Math.max(1,Math.ceil(w/200)):0} menit`}t.addEventListener('input',go);copy.addEventListener('click',async()=>{const text=r.textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Tersalin ✓';setTimeout(()=>copy.textContent='Salin',1500)}catch(e){copy.textContent='Gagal menyalin';setTimeout(()=>copy.textContent='Salin',1800)}});document.getElementById('reset').addEventListener('click',()=>{t.value='';go();copy.textContent='Salin';t.focus()});go();</script></body></html>
